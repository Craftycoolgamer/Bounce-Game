<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #585858;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        #viewport.dragging {
            cursor: grabbing;
        }

        #gameArea {
            width: var(--server-width, 1920px);
            height: var(--server-height, 1080px);
            background-color: #1a1a1a;
            position: relative;
            transform-origin: 0 0;
        }

        #gameArea [id^="square-"] {
            position: absolute;
            width: var(--server-square-size, 50px);
            height: var(--server-square-size, 50px);
            border-radius: 20%;
            /* transition: background-color 0.1s ease, border-color 0.1s ease; */
            /* border: 3px solid transparent; */
        }

        #gameArea [id^="health-bar-"] {
            position: absolute;
            width: var(--server-square-size, 50px);
            height: 4px;
            background-color: #555;
            overflow: hidden;
        }

        #gameArea [id^="health-bar-fill-"] {
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.1s ease;
            width: 100%;
        }

        #gameArea [id^="nametag-"] {
            position: absolute;
            color: white;
            font-size: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            width: var(--server-square-size, 50px);
            transform: translateX(-50%);
            left: 50%;
        }

        @keyframes shrink {
            from {
                transform: scale(1);
                opacity: 1;
            }
            to {
                transform: scale(0);
                opacity: 0;
            }
        }

        .dying {
            animation: shrink 0.3s ease-out forwards;
        }

        #gameArea [id^="powerup-"] {
            position: absolute;
            width: var(--server-powerup-size, 30px);
            height: var(--server-powerup-size, 30px);
        }

        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        #loginScreen * {
            pointer-events: auto;
        }

        #loginScreen.hidden {
            display: none;
        }

        #loginForm {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            min-width: 400px;
        }

        #loginForm h1 {
            color: white;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
        }

        #loginForm label {
            display: block;
            color: white;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
            text-align: left;
        }

        #roomSelector {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #3a3a3a;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            outline: none;
        }

        #roomSelector:hover {
            border-color: #666;
        }

        #roomSelector option {
            background-color: #3a3a3a;
            color: white;
        }

        #colorPicker {
            height: 50px;
            width: 100%;
            border: none;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: none;
            padding: 0;
            margin-bottom: 2.5rem;
        }

        #colorPicker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch {
            border: none;
            border-radius: 5px;
        }

        #colorPicker::-moz-color-swatch {
            border: none;
            border-radius: 5px;
        }

        #startButton {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #startButton:hover {
            background-color: #66BB6A;
        }

        #startButton:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* ============================================
           CONNECTION STATS DISPLAY - TOGGLE ON/OFF
           Comment out the entire #connectionStats block to disable
           ============================================ */
        #connectionStats {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            min-width: 180px;
        }

        #connectionStats div {
            margin: 4px 0;
        }

        #connectionStats span {
            font-weight: bold;
        }
        /* ============================================ */

        /* ============================================
           PLAYER STATS DISPLAY - TOGGLE ON/OFF
           Comment out the entire #playerStats block to disable
           ============================================ */
        #playerStats {
            position: fixed;
            top: 140px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            min-width: 180px;
        }

        #playerStats div {
            margin: 4px 0;
        }

        #playerStats span {
            font-weight: bold;
        }

        #playerStats.hidden {
            display: none;
        }
        /* ============================================ */
    </style>
</head>
<body>
    <div id="loginScreen">
        <div id="loginForm">
            <h1>Join Game</h1>
            <label for="roomSelector">Select Room:</label>
            <select id="roomSelector">
                <option value="">Loading rooms...</option>
            </select>
            <label for="colorPicker">Choose Your Color:</label>
            <input type="color" id="colorPicker" value="#4CAF50" />
            <button id="startButton">Start Game</button>
        </div>
    </div>
    <div id="viewport">
        <div id="gameArea"></div>
    </div>
    <!-- ============================================
         CONNECTION STATS DISPLAY - TOGGLE ON/OFF
         Comment out the entire #connectionStats div to disable
         ============================================ -->
    <div id="connectionStats">
        <div>Status: <span id="connectionStatus">Disconnected</span></div>
        <div>Socket ID: <span id="socketId">-</span></div>
        <div>Ping: <span id="ping">-</span>ms</div>
        <div>Player ID: <span id="playerId">-</span></div>
    </div>
    <!-- ============================================ -->
    <!-- ============================================
         PLAYER STATS DISPLAY - TOGGLE ON/OFF
         Comment out the entire #playerStats div to disable
         ============================================ -->
    <div id="playerStats" class="hidden">
        <div>Health: <span id="playerHealth">-</span> / <span id="playerMaxHealth">-</span></div>
        <div>Damage: <span id="playerDamage">-</span></div>
        <div>Powerups: <br>
            <span id="playerPowerups">None</span>
        </div>
    </div>
    <!-- ============================================ -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
