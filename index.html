<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        [id^="square-"] {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 20%;
            transition: background-color 0.1s ease, border-color 0.1s ease;
            border: 3px solid transparent;
        }

        [id^="health-bar-"] {
            position: absolute;
            width: 50px;
            height: 4px;
            background-color: #555;
            overflow: hidden;
        }

        [id^="health-bar-fill-"] {
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.1s ease;
            width: 100%;
        }

        [id^="nametag-"] {
            position: absolute;
            color: white;
            font-size: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: bold;
            width: 50px;
            transform: translateX(-50%);
            left: 50%;
        }

        @keyframes shrink {
            from {
                transform: scale(1);
                opacity: 1;
            }
            to {
                transform: scale(0);
                opacity: 0;
            }
        }

        .dying {
            animation: shrink 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <script src="script.js"></script>
</body>
</html>
